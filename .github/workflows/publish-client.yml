name: Publish Hive MCP Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact hive-mcp-client version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-client-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish hive-mcp-client
    if: >-
      github.repository == 'hive-intel/hive-sdk' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-client-release
    env:
      NPM_CONFIG_PROVENANCE: "true"
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout protected client source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').name")" = "hive-mcp-client"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          test "$(node -p "require('./package.json').repository.url")" = "git+https://github.com/hive-intel/hive-sdk.git"
          test "$(node -p "require('./package.json').publishConfig.access")" = "public"
          test "$(node -p "require('./package.json').private === true")" = "false"
          test -f package-lock.json

          TAG="mcp-client-v${VERSION}"
          git fetch --force --tags origin main:refs/remotes/origin/main
          git rev-parse --verify "refs/tags/${TAG}^{commit}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git diff --quiet "${TAG}" -- .

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install current npm publishing toolchain
        run: |
          npm install --global npm@12.0.0 sigstore@5.0.0
          test "$(npm --version)" = "12.0.0"
          test "$(node -p "require('$(npm root --global)/sigstore/package.json').version")" = "5.0.0"

      - name: Install locked client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Verify client package
        working-directory: client
        run: npm run typecheck && npm run test && npm run build && npm run pack:check

      - name: Pack and validate exact client artifact
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          TARBALL="${RUNNER_TEMP}/client-package/hive-mcp-client-${RELEASE_VERSION}.tgz"
          mkdir -p "${RUNNER_TEMP}/client-package"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/client-package" >/dev/null
          test -f "$TARBALL"
          npm publish "$TARBALL" --dry-run --provenance=false --ignore-scripts --access public >/dev/null
          echo "CLIENT_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Check immutable npm version
        id: npm
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          LOCAL_INTEGRITY="$(node -e 'const {createHash}=require("node:crypto");const {readFileSync}=require("node:fs");process.stdout.write("sha512-"+createHash("sha512").update(readFileSync(process.env.CLIENT_TARBALL)).digest("base64"))')"
          echo "local_integrity=$LOCAL_INTEGRITY" >> "${GITHUB_OUTPUT}"
          if npm view "hive-mcp-client@${VERSION}" version >/dev/null 2>npm-view.err; then
            REMOTE_INTEGRITY="$(npm view "hive-mcp-client@${VERSION}" dist.integrity)"
            test "$REMOTE_INTEGRITY" = "$LOCAL_INTEGRITY" || {
              echo "Existing immutable npm version has different integrity" >&2
              exit 1
            }
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          elif grep -q 'E404' npm-view.err; then
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          else
            cat npm-view.err >&2
            exit 1
          fi

      - name: Publish through npm trusted publishing
        if: steps.npm.outputs.already_published != 'true'
        run: npm publish "${CLIENT_TARBALL}" --access public --provenance

      - name: Confirm published version
        working-directory: client
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            REMOTE_VERSION="$(npm view "hive-mcp-client@${RELEASE_VERSION}" version 2>/dev/null || true)"
            REMOTE_INTEGRITY="$(npm view "hive-mcp-client@${RELEASE_VERSION}" dist.integrity 2>/dev/null || true)"
            if test "$REMOTE_VERSION" = "${RELEASE_VERSION}" && test "$REMOTE_INTEGRITY" = '${{ steps.npm.outputs.local_integrity }}'; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
